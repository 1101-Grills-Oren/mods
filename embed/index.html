<!DOCTYPE html>
<head>
</head>
<body>
	<embed id="embedbox" src="https://www.youtube.com/embed/pzp2cYnLoUw" width=500 height=320>
  <input type="text" id="embedtarget">
  <input type="button" id="changeembedbutton">
	<script>
  // Select the button element
  const button = document.getElementById('changeembedbutton');

  // Listen for the click event
  button.addEventListener('click', function() {
	  
	  x=document.getElementById("embedtarget").value;
	  if(x.includes("https://www.youtube.com/watch?v=")){
		  x=x.split("?")[1]
		  x=x.split("&")
		  x.forEach((entry)=>{
			  if(entry.split("=")[0]=="v"){
				  document.getElementById("embedbox").src="https://www.youtube.com/embed/"+entry.split("=")[1];
			  }
		  })
	  }else{
	    document.getElementById("embedbox").src=x;
	  }
  });
</script>
</body>
